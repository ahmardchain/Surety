<!doctype html>
<html><head><meta charset="utf-8"><title>Transaction</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fafaf9;color:#18181b;font:16px/1.5 Geist,Inter,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:40px 24px}
.top{display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px}
.chip{font-size:12px;border:1px solid #e4e4e7;border-radius:99px;padding:2px 10px;color:#71717a;font-weight:500}
h1{font-size:34px;letter-spacing:-.02em;margin:28px 0 6px}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:14px;word-break:break-all}
.muted{color:#71717a}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:20px 22px;margin-top:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px -4px rgba(0,0,0,.06)}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#71717a;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ok{display:inline-flex;gap:6px;align-items:center;background:#ecfdf5;color:#047857;border-radius:99px;padding:3px 12px;font-weight:600;font-size:14px}
.flow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #f4f4f5;font-size:17px}
.flow:last-child{border-bottom:0}
.amt{margin-left:auto;font-weight:700;font-size:20px;color:#047857}
.arrow{color:#a1a1aa}
.pill{background:#f4f4f5;border-radius:8px;padding:3px 10px;font-weight:500}
.dao{background:#ecfdf5;color:#065f46}
.ev{background:#09090b;color:#e4e4e7;border-radius:10px;padding:14px;font:13px/1.55 "Geist Mono",monospace;white-space:pre-wrap;word-break:break-all;margin-top:10px}
</style></head>
<body><main>
<div class="top"><svg viewBox="0 0 32 32" width="30" height="30"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M21 10.5a5 5 0 0 0-10 0c0 2.8 2.2 5 5 5s5 2.2 5 5a5 5 0 0 1-10 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="21" cy="10.5" r="2.3" fill="#fff"/><circle cx="11" cy="20.5" r="2.3" fill="#fff"/></svg>Surety <span class="chip">NEAR testnet · read from RPC</span></div>
<h1 id="title"></h1>
<div class="mono muted" id="hash"></div>
<div class="card grid">
  <div><div class="k">Status</div><div id="status" style="margin-top:6px"></div></div>
  <div><div class="k">Signed by</div><div id="signer" class="mono" style="margin-top:6px"></div></div>
  <div><div class="k">Called</div><div id="method" class="mono" style="margin-top:6px"></div></div>
  <div><div class="k">Block</div><div id="block" class="mono" style="margin-top:6px"></div></div>
</div>
<div class="card"><div class="k">NEAR moved in this one transaction</div><div id="flows" style="margin-top:6px"></div></div>
<div class="card"><div class="k">Contract event</div><div id="events"></div></div>
</main>
<script>
const q=new URLSearchParams(location.search);
const short=a=>a.replace(/-[a-z0-9]{8}\.testnet$/,"").replace(/\.sputnik-v2\.testnet$/," (Sputnik DAO)");
const near=y=>{const v=BigInt(y),w=v/10n**24n,f=(v%10n**24n).toString().padStart(24,"0").slice(0,3).replace(/0+$/,"");return w+(f?"."+f:"")+" NEAR"};
document.getElementById("title").textContent=q.get("title")||"Transaction";
document.getElementById("hash").textContent="tx "+q.get("tx");
fetch("https://rpc.testnet.near.org",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"EXPERIMENTAL_tx_status",params:{tx_hash:q.get("tx"),sender_account_id:q.get("sender"),wait_until:"NONE"}})})
.then(r=>r.json()).then(({result:r})=>{
  const t=r.transaction, fc=t.actions.find(a=>a.FunctionCall);
  document.getElementById("status").innerHTML=r.status.SuccessValue!==undefined?'<span class="ok">✓ Success</span>':'<span>Failed</span>';
  document.getElementById("signer").textContent=short(t.signer_id);
  document.getElementById("method").textContent=fc?fc.FunctionCall.method_name+"()":"transfer";
  fetch("https://rpc.testnet.near.org",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"block",params:{block_id:r.transaction_outcome.block_hash}})}).then(x=>x.json()).then(b=>document.getElementById("block").textContent="#"+b.result.header.height.toLocaleString());
  const flows=[];
  for(const x of r.receipts){ if(x.predecessor_id==="system")continue; for(const a of (x.receipt.Action||{actions:[]}).actions){
    if(a.Transfer) flows.push(`<div class="flow"><span class="pill">${short(x.predecessor_id)}</span><span class="arrow">→</span><span class="pill ${/sputnik/.test(x.receiver_id)?"dao":""}">${short(x.receiver_id)}</span><span class="amt">${near(a.Transfer.deposit)}</span></div>`);
  }}
  const logs=r.receipts_outcome.flatMap(o=>o.outcome.logs).filter(l=>l.startsWith("EVENT_JSON:")).map(l=>JSON.parse(l.slice(11)));
  for(const e of logs){ for(const d of e.data){ if(d.from) for(const f of d.from) flows.unshift(`<div class="flow"><span class="pill">${short(f.guarantor)}'s locked savings</span><span class="arrow">→</span><span class="muted">claimed</span><span class="amt" style="color:#be123c">− ${near(f.amount)}</span></div>`); } }
  document.getElementById("flows").innerHTML=flows.join("")||'<div class="muted">none</div>';
  document.getElementById("events").innerHTML=logs.map(e=>`<div class="ev">${e.event}\n${JSON.stringify(e.data[0],(k,v)=>typeof v==="string"&&/^\d{19,}$/.test(v)?near(v):typeof v==="string"?short(v):v,2)}</div>`).join("");
});
</script></body></html>
